name: Activate institutional workstation

on:
  push:
    branches:
      - institutional-workstation-consolidation

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate single workstation layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text()
          import re
          s = re.sub(r'\n<script src="/web/workstation-v3\.js[^\n]*</script>', '', s)
          s = re.sub(r'\n<script src="/web/workstation-v4\.js[^\n]*</script>', '', s)
          s = re.sub(r'\n<script src="/web/workstation-v5\.js[^\n]*</script>', '', s)
          tag = '<script src="/web/workstation.js?v=20260915-1" defer></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git diff --cached --quiet || git commit -m 'chore: activate single institutional workstation'
          git push
