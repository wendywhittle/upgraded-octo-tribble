name: Activate workstation v5

on:
  push:
    branches:
      - dashboard-institutional-workstation-v5

permissions:
  contents: write

jobs:
  wire-v5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V5 integration layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text()
          tag = '<script src="/web/workstation-v5.js?v=20260915-1" defer></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git diff --cached --quiet || git commit -m 'chore: activate workstation v5'
          git push
