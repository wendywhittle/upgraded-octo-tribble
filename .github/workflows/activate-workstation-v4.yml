name: Activate Workstation V4

on:
  push:
    branches:
      - dashboard-institutional-workstation-v4

permissions:
  contents: write

jobs:
  wire-v4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V4 interaction layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text()
          tag = '<script src="/web/workstation-v4.js?v=20260915-1" defer></script>'
          if tag not in s:
              marker = '<script src="/web/workstation-v3.js?v=20260914-1" defer></script>'
              if marker in s:
                  s = s.replace(marker, marker + '\n' + tag)
              else:
                  s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git diff --cached --quiet || git commit -m 'chore: activate workstation v4'
          git push
