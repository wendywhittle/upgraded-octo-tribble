name: Activate workstation v3
on:
  push:
    branches:
      - dashboard-interactive-workstation-v3
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add workstation interaction layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text()
          marker = '<script src="/web/app.js?v=20260914-1" defer></script>'
          tag = '<script src="/web/workstation-v3.js?v=20260914-1" defer></script>'
          if tag not in s:
              s = s.replace(marker, marker + '\n' + tag)
              p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html
          git diff --cached --quiet || git commit -m 'Wire workstation v3 interaction layer'
          git push